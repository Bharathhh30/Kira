[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.138.2",
    "sqlalchemy>=2.0.51",
    "asyncpg>=0.30.0",
    "pydantic-settings>=2.7.1",
    "pyjwt>=2.10.1",
    "bcrypt>=4.2.1",
    "alembic>=1.14.0",
    "email-validator>=2.0.0",
    "pymupdf>=1.25.1",
    "pdfplumber>=0.11.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.15.20",
    "httpx>=0.28.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = "."

