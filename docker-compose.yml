services:
  db:
    image: postgres:17-alpine
    container_name: kira-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: kira
      POSTGRES_PASSWORD: kira_password
      POSTGRES_DB: kira
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
